<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ByteGames - Cadastrar Produto</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">BYTE<span>GAMES</span></a>
        <div class="navbar-links">
            <a href="/produtos" class="btn btn-secundario btn-sm">← Cancelar</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h3>🎮 Cadastrar Novo Jogo</h3>

            <form th:action="@{/produtos}" th:object="${produto}" method="post" enctype="multipart/form-data">

                <div class="form-group">
                    <label for="nome">Nome do Jogo</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: The Witcher 3"
                           th:classappend="${#fields.hasErrors('nome')} ? 'campo-invalido'">
                    <span class="erro-validacao" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" th:field="*{descricao}" rows="4" placeholder="Descreva o jogo..."
                              th:classappend="${#fields.hasErrors('descricao')} ? 'campo-invalido'"></textarea>
                    <span class="erro-validacao" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>
                </div>

                <div style="display: flex; gap: 20px;">
                    <div class="form-group" style="flex: 1;">
                        <label for="preco">Preço (R$)</label>
                        <input type="number" id="preco" step="0.01" min="0.01" th:field="*{preco}"
                               th:classappend="${#fields.hasErrors('preco')} ? 'campo-invalido'">
                        <span class="erro-validacao" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></span>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="estoque">Estoque</label>
                        <input type="number" id="estoque" min="0" th:field="*{estoque}"
                               th:classappend="${#fields.hasErrors('estoque')} ? 'campo-invalido'">
                        <span class="erro-validacao" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" th:field="*{categoria}"
                            th:classappend="${#fields.hasErrors('categoria')} ? 'campo-invalido'">
                        <option value="">-- Selecione uma categoria --</option>
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}"></option>
                    </select>
                    <span class="erro-validacao" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
                </div>

                <div class="form-group">
                    <label for="imagemFile">Imagem do Jogo</label>
                    <div class="image-upload-wrapper">
                        <input type="file" id="imagemFile" name="imagemFile" accept="image/*" class="file-input" onchange="previewImage(event)">
                        <div id="imagePreviewContainer" class="image-preview-container" style="display: none; margin-top: 10px;">
                            <img id="imagePreview" src="#" alt="Prévia da imagem" style="max-width: 200px; max-height: 200px; border-radius: 8px; border: 1px solid var(--border);" />
                        </div>
                    </div>
                    <small style="color: var(--text-secondary); display: block; margin-top: 5px;">Selecione um arquivo de imagem (PNG, JPG, JPEG).</small>
                    <span class="erro-validacao" th:if="${#fields.hasErrors('imagem')}" th:errors="*{imagem}"></span>
                </div>

                <div style="display: flex; justify-content: space-between; margin-top: 30px;">
                    <a href="/produtos" class="btn btn-secundario">Cancelar</a>
                    <button type="submit" class="btn btn-principal">✓ Salvar Jogo</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('imagePreview');
                output.src = reader.result;
                document.getElementById('imagePreviewContainer').style.display = 'block';
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            } else {
                document.getElementById('imagePreviewContainer').style.display = 'none';
            }
        }
    </script>
</body>
</html>
