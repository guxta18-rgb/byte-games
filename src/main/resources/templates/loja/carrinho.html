<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ByteGames - Seu Carrinho</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">BYTE<span>GAMES</span></a>
        <div class="navbar-links">
            <a href="/" class="btn btn-secundario btn-sm">← Continuar Comprando</a>
            <a href="/produtos" class="btn btn-secundario btn-sm">⚙️ Produtos</a>
            <a href="/categorias" class="btn btn-secundario btn-sm">📂 Categorias</a>
        </div>
    </nav>

    <div class="container" style="max-width: 850px;">
        <div class="page-header">
            <div>
                <h1 class="page-title">🛍️ Carrinho de Compras</h1>
                <p class="page-subtitle">Revise seus itens antes de finalizar</p>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Jogo</th>
                        <th>Preço Unitário</th>
                        <th style="text-align: center;">Qtd</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${itens}">
                        <td>
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <img th:src="${item.produto.imagem != null && !item.produto.imagem.empty} ? @{/uploads/{img}(img=${item.produto.imagem})} : @{/img/default-game.png}" class="produto-thumb" alt="Miniatura do produto" />
                                <div>
                                    <strong th:text="${item.produto.nome}" style="color: var(--text-primary); display: block;"></strong>
                                    <small th:text="${item.produto.categoria.nome}" style="display: block; color: var(--purple); font-size: 11px; margin-top: 2px;"></small>
                                </div>
                            </div>
                        </td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(item.produto.preco, 1, 'POINT', 2, 'COMMA')}" style="color: var(--text-secondary);"></td>
                        <td style="text-align: center;">
                            <span th:text="${item.quantidade}" style="font-weight: 700; color: var(--purple);"></span>
                        </td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}" style="color: var(--green); font-weight: 700;"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(itens)}">
                        <td colspan="4" class="empty-state">
                            <p>Seu carrinho está vazio.</p>
                            <a href="/" style="color: var(--purple);">Ir para a vitrine</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="margin-top: 24px; display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-card); padding: 24px; border-radius: 12px; border: 1px solid var(--border);">
            <div>
                <span style="color: var(--text-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; display: block;">Total do Pedido</span>
                <strong th:text="${'R$ ' + #numbers.formatDecimal(totalGeral, 1, 'POINT', 2, 'COMMA')}" style="color: var(--green); font-size: 30px; font-family: 'Rajdhani', sans-serif;">R$ 0,00</strong>
            </div>
            <div style="display: flex; gap: 12px;">
                <form th:action="@{/carrinho/limpar}" method="post" th:if="${!#lists.isEmpty(itens)}">
                    <button type="submit" class="btn btn-danger">🗑️ Limpar Carrinho</button>
                </form>
                <a href="/" class="btn btn-principal">✓ Finalizar Compra</a>
            </div>
        </div>
    </div>
</body>
</html>
