<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ByteGames - Nova Categoria</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">BYTE<span>GAMES</span></a>
        <div class="navbar-links">
            <a href="/categorias" class="btn btn-secundario btn-sm">← Cancelar</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h3>📂 Nova Categoria</h3>

            <form th:action="@{/categorias}" th:object="${categoria}" method="post">

                <div class="form-group">
                    <label for="nome">Nome da Categoria</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Ex: Simulação"
                           th:classappend="${#fields.hasErrors('nome')} ? 'campo-invalido'">
                    <span class="erro-validacao" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição (opcional)</label>
                    <textarea id="descricao" th:field="*{descricao}" rows="3" placeholder="Descreva o gênero..."
                              th:classappend="${#fields.hasErrors('descricao')} ? 'campo-invalido'"></textarea>
                    <span class="erro-validacao" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>
                </div>

                <div style="display: flex; justify-content: space-between; margin-top: 30px;">
                    <a href="/categorias" class="btn btn-secundario">Cancelar</a>
                    <button type="submit" class="btn btn-principal">✓ Salvar Categoria</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
