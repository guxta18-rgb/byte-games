<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ByteGames - Editar FAQ</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
    <!-- Navbar compartilhada -->
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar}"></nav>

    <div class="container">
        <div class="form-container">
            <h3 style="color: var(--purple);">✏️ Editar FAQ</h3>

            <form th:action="@{/faq/{id}(id=${faq.id})}" th:object="${faq}" method="post">

                <div class="form-group">
                    <label for="pergunta">Pergunta Frequente</label>
                    <input type="text" id="pergunta" th:field="*{pergunta}"
                           th:classappend="${#fields.hasErrors('pergunta')} ? 'campo-invalido'">
                    <span class="erro-validacao" th:if="${#fields.hasErrors('pergunta')}" th:errors="*{pergunta}"></span>
                </div>

                <div class="form-group">
                    <label for="resposta">Resposta</label>
                    <textarea id="resposta" th:field="*{resposta}" rows="5"
                              th:classappend="${#fields.hasErrors('resposta')} ? 'campo-invalido'"></textarea>
                    <span class="erro-validacao" th:if="${#fields.hasErrors('resposta')}" th:errors="*{resposta}"></span>
                </div>

                <div class="form-group">
                    <label for="emailContato">E-mail de Contato do Autor</label>
                    <input type="text" id="emailContato" th:field="*{emailContato}"
                           th:classappend="${#fields.hasErrors('emailContato')} ? 'campo-invalido'">
                    <span class="erro-validacao" th:if="${#fields.hasErrors('emailContato')}" th:errors="*{emailContato}"></span>
                </div>

                <div style="display: flex; justify-content: space-between; margin-top: 30px;">
                    <a href="/faq" class="btn btn-secundario">Cancelar</a>
                    <button type="submit" class="btn btn-purple">✓ Atualizar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
