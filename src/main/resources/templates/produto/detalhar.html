<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ByteGames - Detalhes do Jogo</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

    <div class="container">
        <div class="form-container" style="max-width: 700px;">
            <h3 style="color: #4da6ff; text-align: left; border-bottom: 2px solid #292a37; padding-bottom: 10px;">ℹ️ Ficha Técnica do Produto</h3>
            
            <div style="margin-top: 20px;">
                <p style="font-size: 14px; color: #a8a8b3; margin-bottom: 5px;">Nome do Jogo / Produto:</p>
                <h1 th:text="${produto.nome}" style="color: #fff; margin-bottom: 20px;">Nome do Jogo</h1>
                
                <div style="display: flex; gap: 40px; margin-bottom: 25px; background: #121214; padding: 15px; border-radius: 4px;">
                    <div>
                        <p style="font-size: 13px; color: #a8a8b3;">Preço:</p>
                        <strong th:text="${'R$ ' + produto.preco}" style="color: #04d361; font-size: 20px;">R$ 0.00</strong>
                    </div>
                    <div>
                        <p style="font-size: 13px; color: #a8a8b3;">Gênero / Categoria:</p>
                        <strong th:text="${produto.categoria.nome}" style="color: #9871ff; font-size: 18px;">Categoria</strong>
                    </div>
                    <div>
                        <p style="font-size: 13px; color: #a8a8b3;">Unidades em Estoque:</p>
                        <span th:text="${produto.estoque}" 
                              th:class="${produto.estoque == 0} ? 'badge bg-perigo' : 'badge bg-sucesso'" 
                              style="font-size: 14px; display: inline-block; margin-top: 5px;">0</span>
                    </div>
                </div>

                <div style="margin-bottom: 30px;">
                    <p style="font-size: 14px; color: #a8a8b3; margin-bottom: 8px;">Descrição Completa e Requisitos:</p>
                    <div style="background-color: #121214; padding: 15px; border-radius: 4px; line-height: 1.6; border: 1px solid #292a37; color: #e1e1e6; white-space: pre-wrap;" 
                         th:text="${produto.descricao}">
                        Descrição do jogo aqui...
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; border-top: 1px solid #292a37; padding-top: 20px;">
                    <a href="/produtos" class="btn btn-secundario">⬅️ Voltar para a Lista</a>
                    <a th:href="@{/produtos/{id}/editar(id=${produto.id})}" class="btn btn-info" style="color: white; background-color: #007bff;">Editar este Jogo</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
